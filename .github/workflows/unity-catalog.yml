name: Unity Catalog
on:
  pull_request:
    paths:
      - datasets/**
  issue_comment:
    types:
      - created

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  unity-catalog:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/update-uc')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('should_trigger', 'true');
              core.setOutput('branch', context.payload.pull_request.head.ref);
              core.setOutput('prnumber', context.payload.pull_request.number);
              return;
            }

            const pullNumber = context.payload.issue.number;
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              }
            );

            const touchesDatasets = files.some(file => file.filename.startsWith('datasets/'));

            core.setOutput('should_trigger', String(touchesDatasets));
            core.setOutput('branch', pullRequest.data.head.ref);
            core.setOutput('prnumber', pullNumber);
      - name: Call Azure
        if: steps.pr-context.outputs.should_trigger == 'true'
        uses: amsterdam/trigger-ado-pipeline@v1
        with:
          pipeline-id: ${{ secrets.AZURE_DEVOPS_PIPELINE_ID_UC }}
          organisation: ${{ secrets.AZURE_DEVOPS_ORG }}
          project: ${{ secrets.AZURE_DEVOPS_PROJECT }}
          pat-token: ${{ secrets.AZURE_DEVOPS_TOKEN }}
          template-params: '{"environment": "dev", "branch": "${{ steps.pr-context.outputs.branch }}", "prnumber": ${{ steps.pr-context.outputs.prnumber }}}'
